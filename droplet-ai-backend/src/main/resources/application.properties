spring.application.name=droplet-ai-backend

# Load ignored per-developer settings from droplet-ai-backend/.env when running locally.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/droplet_ai
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

firebase.project-id=${FIREBASE_PROJECT_ID:codenexus-a76a4}
firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:firebase-service-account.json}
